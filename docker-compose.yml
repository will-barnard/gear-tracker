services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gear_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    expose:
      - "5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gear_tracker
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Chicago}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      # Photos, receipts, PDFs → brew-bucket. Key: read/write/delete on uploads only.
      BREW_BUCKET_URL: ${BREW_BUCKET_URL:-}
      BREW_BUCKET_KEY: ${BREW_BUCKET_KEY:-}
      BREW_BUCKET_BUCKET: ${BREW_BUCKET_BUCKET:-uploads}
      ATTACHMENT_MAX_MB: ${ATTACHMENT_MAX_MB:-25}
      # Nightly pg_dump → brew-bucket. Key: read/write on backups only.
      BACKUP_BREW_BUCKET_KEY: ${BACKUP_BREW_BUCKET_KEY:-}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
    expose:
      - "3000"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - internal
    depends_on:
      - backend

networks:
  internal:

volumes:
  postgres_data:
    name: gear-tracker-postgres

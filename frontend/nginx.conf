server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Handle Vue Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api {
        # ipv6=off: without it Docker's DNS SERVFAILs the AAAA lookup and
        # requests intermittently fail with "backend could not be resolved".
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend http://backend:3000;

        # Photo/PDF uploads. nginx's default is 1m. Keep in step with
        # ATTACHMENT_MAX_MB on the backend (and Beachhead's proxy in front).
        client_max_body_size 30m;
        # Stream uploads through to the backend instead of spooling them to disk first.
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Always revalidate the app shell so a deploy shows up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cache vite's hashed assets. A prefix match rather than the old
    # extension regex: regex locations win over /api, so any API path ending
    # in .jpg or .png would have been looked up on disk instead of proxied.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
